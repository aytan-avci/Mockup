        :root {

            --bg-base: #0b0e14;

            --bg-subtle: #0c1017;
            --border-color: #232c3d;
            --border-strong: #35425b;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
        }

        html.light {
            /* Açık Tema Değişkenleri (Varsayılan Kurumsal Platin & Slate) */
            --bg-base: #f1f5f9;
            --bg-card: #ffffff;
            --bg-card-hover: #f8fafc;
            --bg-subtle: #f8fafc;
            --border-color: #cbd5e1;
            --border-strong: #94a3b8;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            transition: background-color 0.2s ease, color 0.2s ease;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* İnce Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-subtle);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-strong);
        }
        .metro-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            position: relative;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        .metro-card:hover {
            border-color: var(--border-strong);
            background-color: var(--bg-card-hover);
        }
        .metro-accent-line {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
        }

        // ============================================================================
        // 10. HIZLI SATIŞ VE KASA EKRANI (DİPLOMATİK, TAX-FREE & REYON FİŞİ ÇAĞIRMA)
        // ============================================================================
        const SalesPOSScreen = ({ 
            session, 
            onBackToMenu, 
            mode, 
            setMode, 
            activeCustomerInitial = null,
            theme,
            toggleTheme,
            initialCartItem = null,
            isFullscreen,
            toggleFullscreen
        }) => {
            const [cart, setCart] = useState(initialCartItem ? [
                {
                    id: generateId(),
                    productId: initialCartItem.productId || initialCartItem.id,
                    barcode: initialCartItem.barcode,
                    sku: initialCartItem.sku,
                    name: initialCartItem.name,
                    price: initialCartItem.price,
                    kdv: initialCartItem.kdv,
                    quantity: 1,
                    size: initialCartItem.size || 'Std',
                    sizes: initialCartItem.sizes || ['Std'],
                    salespersonCode: SALESPERSONS[0].code,
                    discountAmount: 0,
                    isReturn: false,
                    isEndless: true
                }
            ] : []);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('Tümü');
            const [salesperson, setSalesperson] = useState(SALESPERSONS[0]);
            const [customer, setCustomer] = useState(activeCustomerInitial);
            const [usePoints, setUsePoints] = useState(false);
            const [parkedCarts, setParkedCarts] = useState([]);
            const [appliedCoupon, setAppliedCoupon] = useState(null);
            const [couponCodeInput, setCouponCodeInput] = useState('');
            const [showCampaignsModal, setShowCampaignsModal] = useState(false);
            const [coPilotExpanded, setCoPilotExpanded] = useState(false);
            const [mobileTab, setMobileTab] = useState('catalog');
            const [queueBustModalOpen, setQueueBustModalOpen] = useState(false);
            const [isOffline, setIsOffline] = useState(false);
            const [offlineQueue, setOfflineQueue] = useState([]);
            const [managerModalOpen, setManagerModalOpen] = useState(false);
            const [managerAction, setManagerAction] = useState(null);
            const [managerPinInput, setManagerPinInput] = useState('');
            const [lastReceiptDoc, setLastReceiptDoc] = useState(null);
            const receiptCounter = useRef(10490);

            // Mock Hazır Reyon Fişleri
            const QUEUE_BASKETS = [
                {
                    code: 'RF-204',
                    consultant: 'Selin Yıldız (SLN-101)',
                    customer: 'Caner Şahin (VIP)',
                    time: '14:28',
                    items: [
                        { ...PRODUCTS[0], size: 'M', qty: 1 },
                        { ...PRODUCTS[1], size: '32/32', qty: 1 },
                        { ...PRODUCTS[3], size: '90', qty: 1 }
                    ]
                },
                {
                    code: 'RF-108',
                    consultant: 'Burak Demir (BRK-102)',
                    customer: 'Ayşe Yılmaz',
                    time: '14:35',
                    items: [
                        { ...PRODUCTS[8], size: '50', qty: 1 }
                    ]
                }
            ];

            const handleImportQueueBasket = (basket) => {
                const targetCustomer = CUSTOMERS.find(c => c.name.toLowerCase().includes(basket.customer.split(' ')[0].toLowerCase())) || CUSTOMERS[0];
                const targetSp = SALESPERSONS.find(s => basket.consultant.includes(s.code)) || SALESPERSONS[0];

                const newCartItems = basket.items.map(it => ({
                    id: generateId(),
                    productId: it.id,
                    barcode: it.barcode,
                    sku: it.sku,
                    name: it.name,
                    price: it.price,
                    kdv: it.kdv,
                    quantity: it.qty,
                    size: it.size || 'Std',
                    sizes: it.sizes || ['Std'],
                    salespersonCode: targetSp.code,
                    discountAmount: 0,
                    isReturn: false
                }));

                setCart(newCartItems);
                setCustomer(targetCustomer);
                setSalesperson(targetSp);
                setQueueBustModalOpen(false);
                triggerToast(`✓ Reyon Fişi #${basket.code} (${basket.consultant}) kasaya yüklendi!`);
            };

            // Diplomatik & Tax-Free Satış Rejimleri
            const [saleType, setSaleType] = useState('NORMAL');
            const [diplomaticModalOpen, setDiplomaticModalOpen] = useState(false);
            const [diplomaticInfo, setDiplomaticInfo] = useState({
                mission: 'Almanya Federal Cumhuriyeti Başkonsolosluğu',
                idCard: 'CD-884210',
                holderName: 'Hans-Peter Weber',
                docDate: '2026-10-15'
            });

            const [taxFreeModalOpen, setTaxFreeModalOpen] = useState(false);
            const [taxFreeInfo, setTaxFreeInfo] = useState({
                passportNo: 'N84910284',
                country: 'Almanya (DE)',
                fullName: 'Michael Schmidt',
                refundMethod: 'Havalimanı Nakit',
                entryDate: '2026-10-20'
            });

            // Modallar
            const [spModalOpen, setSpModalOpen] = useState(false);
            const [paymentModalOpen, setPaymentModalOpen] = useState(false);
            const [returnModalOpen, setReturnModalOpen] = useState(false);
            const [customerModalOpen, setCustomerModalOpen] = useState(false);
            const [activeReturnProduct, setActiveReturnProduct] = useState(null);
            const [toast, setToast] = useState(null);

            const triggerToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 2500);
            };

            const toggleNetworkMode = () => {
                if (isOffline) {
                    setIsOffline(false);
                    if (offlineQueue.length > 0) {
                        triggerToast(`✓ Yeniden Çevrimiçi: ${offlineQueue.length} adet yerel fiş GİB bulutuna senkronize edildi!`);
                        setOfflineQueue([]);
                    } else {
                        triggerToast('Ağ Durumu: ÇEVRİMİÇİ (GİB Canlı Senkron)');
                    }
                } else {
                    setIsOffline(true);
                    triggerToast('Ağ Durumu: ÇEVRİMDISI (Yerel Kuyruk Aktif - Fiş Kesilebilir)');
                }
            };

            const filteredProducts = useMemo(() => {
                return PRODUCTS.filter(p => {
                    const matchCat = selectedCategory === 'Tümü' || p.category === selectedCategory;
                    const q = searchQuery.trim().toLowerCase();
                    const matchQ = !q || p.name.toLowerCase().includes(q) || p.barcode.includes(q) || p.sku.toLowerCase().includes(q);
                    return matchCat && matchQ;
                });
            }, [selectedCategory, searchQuery]);

            // Sepet Hesaplamaları
            const cartCalculations = useMemo(() => {
                let grossSubtotal = 0;
                let lineDiscounts = 0;
                let afterLineSubtotal = 0;

                cart.forEach(item => {
                    const lineGross = item.price * item.quantity;
                    const lineDisc = (item.discountAmount || 0) * item.quantity;
                    grossSubtotal += lineGross;
                    lineDiscounts += lineDisc;
                    afterLineSubtotal += (lineGross - lineDisc);
                });

                let autoCampaignDiscount = 0;
                if (afterLineSubtotal >= 2500) {
                    autoCampaignDiscount = 250;
                }

                let couponDiscount = 0;
                if (appliedCoupon) {
                    if (appliedCoupon.discountPct) {
                        couponDiscount = (afterLineSubtotal * appliedCoupon.discountPct) / 100;
                    } else if (appliedCoupon.discount) {
                        couponDiscount = appliedCoupon.discount;
                    }
                }

                const custDiscRate = customer ? customer.discountRate : 0;
                const custDiscAmount = afterLineSubtotal > 0 ? afterLineSubtotal * (custDiscRate / 100) : 0;
                
                const pointsDisc = (customer && usePoints && afterLineSubtotal - custDiscAmount - autoCampaignDiscount - couponDiscount > 0)
                    ? Math.min(customer.points, afterLineSubtotal - custDiscAmount - autoCampaignDiscount - couponDiscount)
                    : 0;

                let calculatedTotal = Math.max(0, afterLineSubtotal - custDiscAmount - autoCampaignDiscount - couponDiscount - pointsDisc);
                const totalDiscount = lineDiscounts + custDiscAmount + autoCampaignDiscount + couponDiscount + pointsDisc;

                let kdvTotal = 0;
                const discFactor = afterLineSubtotal > 0 ? (calculatedTotal / afterLineSubtotal) : 1;

                if (saleType === 'DIPLOMATIC') {
                    kdvTotal = 0;
                } else {
                    cart.forEach(item => {
                        const netLine = ((item.price - (item.discountAmount || 0)) * item.quantity) * discFactor;
                        const matrah = netLine / (1 + (item.kdv / 100));
                        kdvTotal += (netLine - matrah);
                    });
                }

                let finalTotal = calculatedTotal;
                if (saleType === 'DIPLOMATIC') {
                    let normalKdv = 0;
                    cart.forEach(item => {
                        const netLine = ((item.price - (item.discountAmount || 0)) * item.quantity) * discFactor;
                        const matrah = netLine / (1 + (item.kdv / 100));
                        normalKdv += (netLine - matrah);
                    });
                    finalTotal = Math.max(0, calculatedTotal - normalKdv);
                }

                const taxFreeRefund = saleType === 'TAXFREE' ? (kdvTotal * 0.82) : 0;

                return {
                    grossSubtotal,
                    lineDiscounts,
                    autoCampaignDiscount,
                    couponDiscount,
                    totalDiscount,
                    kdvBase: saleType === 'DIPLOMATIC' ? finalTotal : (finalTotal - kdvTotal),
                    kdvTotal,
                    taxFreeRefund,
                    total: finalTotal,
                    totalQuantity: cart.reduce((acc, it) => acc + it.quantity, 0)
                };
            }, [cart, customer, usePoints, appliedCoupon, saleType]);

            // Kasa Co-Pilot
            const smartRecommendation = useMemo(() => {
                if (cart.length === 0) {
                    const impulseItem = PRODUCTS.find(p => p.id === '104');
                    return {
                        title: 'Kasa Yanı Fırsatı (Vachetta Hakiki Deri Kemer)',
                        product: impulseItem,
                        discountPrice: 349.90,
                        pitchScript: 'Hoş geldiniz! Bugün el yapımı hakiki İtalyan deri kemerimizde %30 tanışma indirimi var. Fişinize eklememi ister misiniz?',
                        salespersonBonus: '+15 ₺ Prim',
                        badge: 'Günün Fırsatı'
                    };
                }

                const hasShoe = cart.some(i => i.productId === '105' || i.productId === '110');
                const hasDenim = cart.some(i => i.productId === '102' || i.productId === '108');
                const hasTrench = cart.some(i => i.productId === '109');

                if (hasShoe) {
                    const belt = PRODUCTS.find(p => p.id === '104');
                    return {
                        title: 'Kusursuz Deri Kombin Önerisi',
                        product: belt,
                        discountPrice: 349.90,
                        pitchScript: `${customer ? customer.name + ', ' : 'Efendim, '}seçtiğiniz İtalyan ayakkabıyla birebir ton uyumlu Vachetta deri kemerimizde bugün ayakkabı yanına özel %30 indirim var. Kemerinizi de takım yapalım mı?`,
                        salespersonBonus: '+25 ₺ Prim',
                        badge: 'Ayakkabı + Kemer Kombini'
                    };
                }

                if (hasDenim) {
                    const tee = PRODUCTS.find(p => p.id === '101');
                    return {
                        title: 'Organik Pima Tişört Ekleme Fırsatı',
                        product: tee,
                        discountPrice: 249.90,
                        pitchScript: `${customer ? customer.name + ', ' : 'Beyefendi/Hanımefendi, '}satın aldığınız Selvedge Jean üzerine en çok yakışan %100 Pima pamuk tişörtümüzde kasada ikinci ürüne %50 avantajı var. Bedeninizi getireyim mi?`,
                        salespersonBonus: '+18 ₺ Prim',
                        badge: 'Denim + Tişört Fırsatı'
                    };
                }

                if (hasTrench) {
                    const glasses = PRODUCTS.find(p => p.id === '106');
                    return {
                        title: 'VIP Aksesuar Tamamlayıcı',
                        product: glasses,
                        discountPrice: 1299.90,
                        pitchScript: `${customer ? customer.name + ', ' : 'Efendim, '}bu kruvaze trençkotu tamamlayacak polarize titanyum güneş gözlüğümüzde trençkot alımlarına özel 400 ₺ anında indirim tanımlandı. Denemek ister misiniz?`,
                        salespersonBonus: '+40 ₺ VIP Prim',
                        badge: 'Kaban & Gözlük Kombini'
                    };
                }

                const shirt = PRODUCTS.find(p => p.id === '103');
                return {
                    title: 'Sezonun Yıldızı Keten Safari Gömlek',
                    product: shirt,
                    discountPrice: 749.90,
                    pitchScript: 'Efendim, sepetinizdeki ürünle harika uyum sağlayan İtalyan keten gömleğimizde bugün kasaya özel 200 ₺ kombin indirimi uygulayabilirim.',
                    salespersonBonus: '+20 ₺ Prim',
                    badge: 'Stil Tavsiyesi'
                };
            }, [cart, customer]);

            const addToCart = (product, customPrice = null) => {
                if (mode === 'return') {
                    setActiveReturnProduct(product);
                    setReturnModalOpen(true);
                    return;
                }
                const defSize = product.sizes ? product.sizes[0] : 'Std';
                const finalPrice = customPrice !== null ? customPrice : product.price;

                setCart(prev => {
                    const exists = prev.find(i => i.productId === product.id && i.size === defSize && !i.isReturn && !i.isEndless && i.price === finalPrice);
                    if (exists) {
                        return prev.map(i => i.id === exists.id ? { ...i, quantity: i.quantity + 1 } : i);
                    }
                    return [...prev, {
                        id: generateId(),
                        productId: product.id,
                        barcode: product.barcode,
                        sku: product.sku,
                        name: customPrice !== null ? `[EK SATIŞ] ${product.name}` : product.name,
                        price: finalPrice,
                        kdv: product.kdv,
                        quantity: 1,
                        size: defSize,
                        sizes: product.sizes || ['Std'],
                        salespersonCode: salesperson.code,
                        discountAmount: 0,
                        isReturn: false
                    }];
                });
                triggerToast(`${product.name} fişe eklendi`);
            };

            const handleBarcodeEnter = (e) => {
                if (e.key === 'Enter' && searchQuery.trim() !== '') {
                    const query = searchQuery.trim();
                    // Eğer reyon fişi no yazıldıysa otomatik çağır
                    if (query.toUpperCase().startsWith('RF-')) {
                        const basket = QUEUE_BASKETS.find(b => b.code.toUpperCase() === query.toUpperCase());
                        if (basket) {
                            handleImportQueueBasket(basket);
                            setSearchQuery('');
                            return;
                        }
                    }

                    const found = PRODUCTS.find(p => p.barcode === query || p.sku.toLowerCase() === query.toLowerCase()) || filteredProducts[0];
                    if (found) {
                        addToCart(found);
                        setSearchQuery('');
                    }
                }
            };

            const confirmReturnLine = (reason) => {
                if (!activeReturnProduct) return;
                setCart(prev => [...prev, {
                    id: generateId(),
                    productId: activeReturnProduct.id,
                    barcode: activeReturnProduct.barcode,
                    sku: activeReturnProduct.sku,
                    name: `(İADE) ${activeReturnProduct.name}`,
                    price: -activeReturnProduct.price,
                    kdv: activeReturnProduct.kdv,
                    quantity: 1,
                    size: activeReturnProduct.sizes?.[0] || 'Std',
                    salespersonCode: salesperson.code,
                    isReturn: true,
                    returnReason: reason
                }]);
                setReturnModalOpen(false);
                setActiveReturnProduct(null);
                setMode('sales');
                triggerToast(`İade satırı eklendi: ${reason}`);
            };

            const applyCouponCode = () => {
                const code = couponCodeInput.trim().toUpperCase();
                const found = CAMPAIGNS.find(c => c.code === code);
                if (found) {
                    setAppliedCoupon(found);
                    setCouponCodeInput('');
                    triggerToast(`✓ ${found.name} kuponu uygulandı!`);

                    triggerToast('Geçersiz veya süresi dolmuş kupon kodu!');

            const updateQty = (id, delta) => {
                setCart(prev => prev.map(it => (it.id === id && it.quantity + delta > 0) ? { ...it, quantity: it.quantity + delta } : it));
            };

            const cycleSize = (id) => {
                setCart(prev => prev.map(it => {
                    if (it.id !== id || !it.sizes) return it;
                    const idx = it.sizes.indexOf(it.size);
                    const next = it.sizes[(idx + 1) % it.sizes.length];
                    return { ...it, size: next };
                }));
            };

            const removeItem = (id) => setCart(prev => prev.filter(it => it.id !== id));
            
            // Fiş iptalinde yönetici onayı kontrolü
            const requestClearCart = () => {
                if (cart.length > 2 || cartCalculations.total > 2000) {
                    setManagerAction({
                        type: 'CLEAR_CART',
                        description: 'Yüksek tutarlı fiş iptali için mağaza müdürü yetkisi gerekmektedir.'

                    clearCartInternal();

                setCart([]);

                setUsePoints(false); 
                setAppliedCoupon(null);

            const parkCart = () => {
                if (cart.length === 0) return;
                setParkedCarts(prev => [...prev, { 
                    id: generateId(), 
                    time: new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}), 
                    cart, 
                    customer, 
                    saleType,
                    diplomaticInfo,
                    taxFreeInfo,
                    total: cartCalculations.total

                triggerToast('Fiş askıya alındı');

                        >

                            <div className="text-[10px] font-mono text-theme-textMuted uppercase mb-1">ALINAN PARÇALI TAHSİLATLAR ({payments.length})</div>
                            {payments.length === 0 ? (
                                <div className="text-center py-4 text-xs font-mono text-theme-textMuted">Henüz ödeme parçası eklenmedi.</div>
                            ) : (
                                payments.map(p => (
                                    <div key={p.id} className="flex justify-between items-center p-2 bg-theme-card border border-theme-border text-xs font-mono">
                                        <div>
                                            <strong className="text-theme-text">{p.method}</strong>
                                            <span className="text-[10px] text-theme-textMuted ml-2">{p.time}</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <span className="font-bold text-theme-text">{formatMoney(p.amount)}</span>
                                            <button onClick={() => removePayment(p.id)} className="text-rose-500 p-0.5"><Icons.Trash size={12} /></button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>

                        {/* Alt Butonlar */}
                        <div className="flex gap-2 flex-shrink-0 pt-2 border-t border-theme-border">
                            <button onClick={onClose} className="px-4 py-2 bg-theme-subtle text-theme-text text-xs font-mono uppercase border border-theme-border">İPTAL</button>
                            <button
                                disabled={remaining > 0 || payments.length === 0}
                                onClick={() => onCompleteSale(payments)}
                                className="flex-1 py-2.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-white font-mono font-bold text-xs uppercase tracking-wider border border-slate-600 flex items-center justify-center gap-2"
                            >
                                <Icons.Check size={15} />
                                <span>{saleType === 'DIPLOMATIC' ? 'DİPLOMATİK MALİ FİŞİ BAS' : saleType === 'TAXFREE' ? 'TAX-FREE MALİ FİŞİ BAS' : 'FİŞİ KES & SATIŞI BİTİR [ENTER]'}</span>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ============================================================================
        // 13. ANA KÖK UYGULAMA (APP)
        // ============================================================================
        const App = () => {
            const [company, setCompany] = useState(ORGANIZATIONS[0]);
            const [store, setStore] = useState(ORGANIZATIONS[0].stores[0]);
            const [session, setSession] = useState(null);
            const [currentView, setCurrentView] = useState('menu');
            const [activeCustomerForSale, setActiveCustomerForSale] = useState(null);
            const [initialOmniItem, setInitialOmniItem] = useState(null);
            const [reportsOpen, setReportsOpen] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);
            
            // Varsayılan Açılış: 'light' (Açık Tema)
            const [theme, setTheme] = useState('light'); 

            const toggleTheme = () => {
                setTheme(prev => (prev === 'dark' ? 'light' : 'dark'));
            };

            const toggleFullscreen = () => {
                try {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen().then(() => {
                            setIsFullscreen(true);
                        }).catch(() => {
                            setIsFullscreen(true);
                        });
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen().then(() => {
                                setIsFullscreen(false);
                            }).catch(() => {
                                setIsFullscreen(false);
                            });
                        }
                    }
                } catch (e) {
                    setIsFullscreen(!isFullscreen);
                }
            };

            useEffect(() => {
                const handleFsChange = () => {
                    setIsFullscreen(!!document.fullscreenElement);
                };
                document.addEventListener('fullscreenchange', handleFsChange);
                return () => document.removeEventListener('fullscreenchange', handleFsChange);
            }, []);

            useEffect(() => {
                if (theme === 'light') {
                    document.documentElement.classList.add('light');
                } else {
                    document.documentElement.classList.remove('light');
                }
            }, [theme]);

            const handleLogin = (sessionData) => {
                setSession(sessionData);
                setCurrentView('menu');
            };

            const handleLogout = () => {
                setSession(null);
                setCurrentView('menu');
                setInitialOmniItem(null);
            };

            if (!session) {
                return (
                    <LoginScreen 
                        onLogin={handleLogin}
                        currentCompany={company}
                        currentStore={store}
                        setCompany={setCompany}
                        setStore={setStore}
                        theme={theme}
                        toggleTheme={toggleTheme}
                        isFullscreen={isFullscreen}
                        toggleFullscreen={toggleFullscreen}
                    />
                );
            }

            // GÖRÜNÜM 1: DASHBOARD
            if (currentView === 'menu') {
                return (
                    <>
                        <MainMenuScreen 
                            session={session}
                            onNavigate={(viewId) => setCurrentView(viewId)}
                            onLogout={handleLogout}
                            openReports={() => setReportsOpen(false) || setReportsOpen(true)}
                            theme={theme}
                            toggleTheme={toggleTheme}
                            isFullscreen={isFullscreen}
                            toggleFullscreen={toggleFullscreen}
                        />

                        {/* X & Z Kasa Raporları Modalı */}
                        {reportsOpen && (
                            <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                                <div className="bg-theme-card border border-theme-border w-full max-w-md p-5 shadow-2xl">
                                    <div className="flex justify-between items-center mb-3 border-b border-theme-border pb-2">
                                        <div>
                                            <h3 className="font-semibold text-xs uppercase text-theme-text flex items-center gap-1.5">
                                                <Icons.Chart size={15} className="text-theme-textMuted" /> Günlük X / Z Mali Kasa Raporu
                                            </h3>
                                            <p className="text-[11px] text-theme-textMuted font-mono mt-0.5">{session.store.name} • {session.cashier.name}</p>
                                        </div>
                                        <button onClick={() => setReportsOpen(false)} className="p-1 text-theme-textMuted hover:text-theme-text"><Icons.X size={15} /></button>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 mb-3">
                                        <div className="bg-theme-subtle p-3 border border-theme-border">
                                            <div className="text-[9px] text-theme-textMuted font-mono font-semibold uppercase tracking-wider">GÜNLÜK NET CİRO</div>
                                            <div className="text-lg font-mono font-bold text-theme-text mt-1">48.920,40 ₺</div>
                                        </div>
                                        <div className="bg-theme-subtle p-3 border border-theme-border">
                                            <div className="text-[9px] text-emerald-500 font-mono font-semibold uppercase tracking-wider">KASA NAKİT DURUMU</div>
                                            <div className="text-lg font-mono font-bold text-emerald-500 mt-1">14.650,00 ₺</div>
                                        </div>
                                    </div>
                                    <div className="space-y-1.5 text-xs font-mono mb-4">
                                        <div className="flex justify-between p-2.5 bg-theme-subtle border border-theme-border"><span>Kredi Kartı (EFT-POS Toplamı):</span><strong className="text-theme-text">31.420,40 ₺</strong></div>
                                        <div className="flex justify-between p-2.5 bg-theme-subtle border border-theme-border"><span>Yemek Kartı & Diğer:</span><strong className="text-theme-text">2.850,00 ₺</strong></div>
                                        <div className="flex justify-between p-2.5 bg-theme-subtle border border-theme-border"><span>Toplam Hesaplanan KDV:</span><strong className="text-theme-text">5.240,10 ₺</strong></div>
                                    </div>
                                    <button onClick={() => setReportsOpen(false)} className="w-full py-2.5 bg-theme-subtle hover:bg-theme-cardHover border border-theme-borderStrong text-theme-text font-mono font-semibold text-xs uppercase tracking-wider transition-colors">
                                        Raporu Kapat
                                    </button>
                                </div>
                            </div>
                        )}
                    </>
                );
            }

            // GÖRÜNÜM 2: OMNICHANNEL HUB
            if (currentView === 'omnichannel') {
                return (
                    <OmnichannelHubScreen 
                        session={session}
                        onBack={() => setCurrentView('menu')}
                        onSellProductFromOmni={(prod) => {
                            setInitialOmniItem(prod);
                            setCurrentView('sales');
                        }}
                        theme={theme}
                        toggleTheme={toggleTheme}
                    />
                );
            }

            // GÖRÜNÜM 3: ÇOKLU MAĞAZA STOK & FİYAT DEFTERİ
            if (currentView === 'stock') {
                return (
                    <MultiStoreStockScreen 
                        session={session}
                        onBack={() => setCurrentView('menu')}
                        onSellProduct={(prod) => {
                            setInitialOmniItem(prod);
                            setCurrentView('sales');
                        }}
                        theme={theme}
                        toggleTheme={toggleTheme}
                    />
                );
            }

            // GÖRÜNÜM 4: CRM & SADAKAT KULÜBÜ
            if (currentView === 'customer') {
                return (
                    <CrmLoyaltyScreen 
                        session={session}
                        onBack={() => setCurrentView('menu')}
                        onStartSaleWithCustomer={(cust) => {
                            setActiveCustomerForSale(cust);
                            setCurrentView('sales');
                        }}
                        theme={theme}
                        toggleTheme={toggleTheme}
                    />
                );
            }

            // GÖRÜNÜM 5 & 6: HIZLI SATIŞ VEYA İADE MASASI
            return (
                <SalesPOSScreen 
                    session={session}
                    onBackToMenu={() => {
                        setActiveCustomerForSale(null);
                        setInitialOmniItem(null);
                        setCurrentView('menu');
                    }}
                    mode={currentView}
                    setMode={setCurrentView}
                    activeCustomerInitial={activeCustomerForSale}
                    theme={theme}
                    toggleTheme={toggleTheme}
                    initialCartItem={initialOmniItem}
                    isFullscreen={isFullscreen}
                    toggleFullscreen={toggleFullscreen}
                />
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
